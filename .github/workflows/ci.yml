name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: go vet
        run: cd agent && go vet ./...
      - name: go test (seed pack included)
        run: cd agent && go test ./...

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: build agent (embed placeholder dist is enough)
        run: cd agent && go build -o smoke-agent ./cmd/fenjue-agent
      - name: e2e smoke on fake platform (never touches real mounts)
        run: |
          set -e
          # Windows 的 RUNNER_TEMP 是反斜杠路径, 进 JSON 会成非法转义, 统一归一为正斜杠。
          D="$(printf '%s' "$RUNNER_TEMP" | sed 's|\\|/|g')/fenjue-smoke"
          mkdir -p "$D"
          cat > "$D/platforms.json" <<EOF
          {
            "schema": "fenjue-platforms-v1",
            "version": "0.0.0-ci",
            "roots": { "memory": "$D/memory", "skills": "$D/skills" },
            "site": { "primary": "https://example.invalid", "mirror": "", "local": "http://127.0.0.1:7799" },
            "platforms": [
              { "id": "t1", "label": "SmokeTest", "support": "ga",
                "os": ["windows", "darwin", "linux"],
                "home": "$D/t1home",
                "mounts": [ { "kind": "link", "from": "$D/t1home/skills", "to": "<skills>" } ],
                "inject": [ { "path": "$D/t1home/AGENTS.md", "mode": "marker" } ] }
            ]
          }
          EOF
          if [ "$RUNNER_OS" = "windows" ]; then BIN="./agent/smoke-agent.exe"; else BIN="./agent/smoke-agent"; fi
          "$BIN" enable t1 --platforms "$D/platforms.json" > enable.out
          grep -q "seeded" enable.out || { cat enable.out; exit 1; }
          "$BIN" verify --platforms "$D/platforms.json" > verify.out
          grep -q "total=2 ok=2" verify.out || { cat verify.out; exit 1; }
          test -f "$D/memory/MEMORY.md"
          test -f "$D/memory/meta/memory_index.md"
          test -f "$D/skills/brainstorming/SKILL.md"
          "$BIN" disable t1 --platforms "$D/platforms.json" > /dev/null
          "$BIN" enable t1 --platforms "$D/platforms.json" > re-enable.out
          grep -q "zero-overwrite" re-enable.out || { cat re-enable.out; exit 1; }
          echo "smoke PASS ($RUNNER_OS)"

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: platform parity (advisory; private source absent in CI => UNVERIFIED, report only)
        continue-on-error: true
        run: python3 scripts/platform_parity.py --private /nonexistent/truth_constants.json || true

  # 阻断型一致性判据。与 parity 的 advisory 性质相反: 以下任何一条红了都视为构建失败。
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本判据要读 git tag。checkout 默认 fetch-depth: 1 不拉 tag,
          # 那样这条腿只能报 UNVERIFIED (测不到 != 通过, 但也证明不了没漂移)。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: seed sanitizer rules selftest (every rule needs a positive and a negative case)
        run: python3 scripts/build_seed.py --selftest
      - name: version sync selftest (drift cases must actually bite)
        run: python3 scripts/check_version_sync.py --selftest
      - name: version sync (tag == product const, manifest == seed const, schema paired with config version)
        run: python3 scripts/check_version_sync.py
      - name: seed manifest cross-check (second implementation, guards against self-consistent-but-wrong)
        run: python3 scripts/verify_seed_manifest.py
      - name: api contract selftest (a phantom endpoint and an undocumented route must both bite)
        run: python3 scripts/check_api_contract.py --selftest
      - name: api contract (docs/API.md <-> router.go, both directions)
        run: python3 scripts/check_api_contract.py
      - name: preset config selftest (every rule needs a positive and a negative case)
        run: python3 scripts/check_preset_config.py --selftest
      - name: preset config (members must resolve to existing platforms, no duplicates)
        run: python3 scripts/check_preset_config.py

  # API 实测腿 (advisory)。需要 go build 并在回环起一个沙箱 serve, 放共享 runner 上做
  # 文档承诺的状态码核对; 失败多半是环境问题, 不该把构建判红, 故与 bench 同样 advisory。
  api-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: probe documented status codes against a sandboxed serve (advisory)
        continue-on-error: true
        run: python3 scripts/check_api_contract.py --live

  # 性能实测腿 (advisory)。与 parity 同一约定: 共享 runner 的性能数字抖动大,
  # 接进阻断链只会制造与代码无关的红。数字的权威来源是 docs/PERFORMANCE.md 的本机实测,
  # CI 这一腿只负责证明脚本没坏 (沙箱隔离 + 动态端口在 Linux 上同样成立)。
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: bench metric selftest (empty samples must stay UNVERIFIED, never 0)
        run: python3 scripts/bench_scale.py --selftest
      - name: scale benchmark on the smallest tier (advisory; numbers are machine specific)
        continue-on-error: true
        run: python3 scripts/bench_scale.py --scale S1

