name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64, ext: "" }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64, ext: "" }
          - { os: macos-latest,   goos: darwin,  goarch: amd64, ext: "" }
          - { os: macos-latest,   goos: darwin,  goarch: arm64, ext: "" }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build web console
        run: cd web && npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: embed web dist
        run: mkdir -p agent/cmd/fenjue-agent/dist && cp -r web/dist/. agent/cmd/fenjue-agent/dist/
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # 静态链接: linux 产物须能在 alpine/musl 等无 glibc 环境运行 (docker 实测 2026-10-02)
          CGO_ENABLED: 0
        run: cd agent && go build -trimpath -ldflags "-s -w" -o fenjue-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/fenjue-agent
      - uses: actions/upload-artifact@v4
        with:
          name: fenjue-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/fenjue-agent-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: checksum every artifact
        # 一次覆盖全部 5 个目标: merge-multiple 已把各 build job 的产物合并到 dist/,
        # 所以校验和必须在合并之后生成, 否则每个 job 只能看见自己那一个文件。
        # 生成在 dist/ 内, 因此 dist/* 通配会自动把它带上, 无需改动 create 命令。
        run: |
          cd dist
          sha256sum fenjue-agent-* > SHA256SUMS
          cat SHA256SUMS
      - name: verify the checksum file lists every artifact
        run: |
          cd dist
          listed=$(wc -l < SHA256SUMS)
          actual=$(ls -1 fenjue-agent-* | wc -l)
          if [ "$listed" -ne "$actual" ]; then
            echo "SHA256SUMS lists $listed entries but there are $actual artifacts" >&2
            ls -1 fenjue-agent-* >&2
            exit 1
          fi
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "fenjue-agent $GITHUB_REF_NAME" --generate-notes
